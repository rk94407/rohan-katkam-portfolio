<!DOCTYPE html>
<html lang="en" data-theme="light" data-direction="editorial" data-namestyle="split" data-motion="on">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rohan Katkam — AI Engineer & Full Stack Developer</title>
  <link rel="icon" href="public/favicon.ico" />

  <!-- set theme before paint to avoid flash -->
  <script>
    try {
      var th = localStorage.getItem("rk-theme");
      if (th) document.documentElement.setAttribute("data-theme", th);
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&family=Archivo:ital,wght@0,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&display=swap" rel="stylesheet" />

  <!-- Global design system -->
  <link rel="stylesheet" href="styles/global.css" />
  <link rel="stylesheet" href="styles/animations.css" />

  <!-- Section styles -->
  <link rel="stylesheet" href="styles/nav.css" />
  <link rel="stylesheet" href="styles/hero.css" />
  <link rel="stylesheet" href="styles/about.css" />
  <link rel="stylesheet" href="styles/skills.css" />
  <link rel="stylesheet" href="styles/experience.css" />
  <link rel="stylesheet" href="styles/projects.css" />
  <link rel="stylesheet" href="styles/contact.css" />
</head>
<body>

  <!-- Custom element -->

  <!-- Content -->

  <script type="text/babel" src="components/contact.jsx"></script>
